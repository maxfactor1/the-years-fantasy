services:
  fantasy:
    build: .
    container_name: years-fantasy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - fantasy-data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/fantasy.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  fantasy-data:
    driver: local
